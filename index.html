<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse OS - Discord Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .drag-region { -webkit-app-region: drag; }
        .no-drag { -webkit-app-region: no-drag; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0B0E14] text-slate-300 h-screen overflow-hidden flex flex-col">

    <header class="h-10 bg-[#0F1219] border-b border-white/5 flex items-center justify-between px-4 flex-shrink-0 drag-region select-none">
        <div class="flex items-center gap-2">
            <div class="w-5 h-5 bg-indigo-500 rounded flex items-center justify-center">
                <i data-lucide="zap" class="w-3 h-3 text-white fill-current"></i>
            </div>
            <span class="font-bold text-[11px] text-white tracking-widest uppercase">PULSE<span class="text-indigo-500">OS</span></span>
        </div>

        <div class="flex items-center h-full no-drag">
            <button onclick="windowControl('min')" class="h-10 w-12 flex items-center justify-center hover:bg-white/5 text-slate-400 transition-colors">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
            <button onclick="windowControl('max')" class="h-10 w-12 flex items-center justify-center hover:bg-white/5 text-slate-400 transition-colors">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="windowControl('close')" class="h-10 w-12 flex items-center justify-center hover:bg-red-500/80 hover:text-white text-slate-400 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <nav class="w-64 bg-[#0F1219] border-r border-white/5 flex flex-col p-4 gap-2 flex-shrink-0">
            <div id="connection-status" class="flex items-center gap-2 text-[10px] font-bold text-slate-500 bg-slate-900/50 px-3 py-2 rounded-lg border border-white/5 mb-4 uppercase tracking-tighter">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                DÉCONNECTÉ
            </div>

            <button onclick="switchTab('dashboard')" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-400 hover:text-white group no-drag">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="font-medium">Dashboard</span>
            </button>
            <button onclick="switchTab('guilds')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-400 hover:text-white group no-drag">
                <i data-lucide="server" class="w-5 h-5"></i>
                <span class="font-medium">Serveurs</span>
            </button>
            <button onclick="switchTab('messenger')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-400 hover:text-white group no-drag">
                <i data-lucide="message-square" class="w-5 h-5"></i>
                <span class="font-medium">Messenger</span>
            </button>
            <div class="mt-auto pt-4 border-t border-white/5">
                <button onclick="switchTab('settings')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-400 hover:text-white group no-drag">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="font-medium">Paramètres</span>
                </button>
            </div>
        </nav>

        <main class="flex-1 flex flex-col bg-[#0B0E14] relative overflow-hidden">
            
            <div id="login-screen" class="absolute inset-0 z-50 bg-[#0B0E14] flex items-center justify-center p-6">
                <div class="w-full max-w-md space-y-8">
                    <div class="text-center">
                        <h2 class="text-3xl font-bold text-white italic tracking-tighter">BIENVENUE</h2>
                        <p class="text-slate-500 mt-2">Entrez votre token bot Discord</p>
                    </div>
                    <div class="bg-[#0F1219] p-8 rounded-3xl border border-white/5 shadow-2xl space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Token Bot</label>
                            <input type="password" id="token-input" placeholder="MTA0..." class="w-full bg-[#0B0E14] border border-white/5 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-indigo-500/50 transition-all placeholder:text-slate-700 no-drag">
                        </div>
                        <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98] no-drag">
                            CONNEXION
                        </button>
                    </div>
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content flex-1 p-8 hidden overflow-y-auto custom-scroll">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-[#0F1219] p-6 rounded-3xl border border-white/5">
                        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Status API</p>
                        <p id="api-latency" class="text-2xl font-bold text-white">-- ms</p>
                    </div>
                    <div class="bg-[#0F1219] p-6 rounded-3xl border border-white/5 border-l-4 border-l-indigo-500">
                        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Serveurs</p>
                        <p id="guild-count" class="text-2xl font-bold text-white">0</p>
                    </div>
                    <div class="bg-[#0F1219] p-6 rounded-3xl border border-white/5">
                        <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Utilisateur</p>
                        <p id="bot-name" class="text-2xl font-bold text-white italic">Non connecté</p>
                    </div>
                </div>
                
                <div class="bg-[#0F1219] rounded-3xl border border-white/5 flex flex-col overflow-hidden min-h-[300px]">
                    <div class="p-4 border-b border-white/5 flex items-center gap-2 bg-white/5">
                        <i data-lucide="terminal" class="w-4 h-4 text-indigo-400"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Console Log</span>
                    </div>
                    <div id="terminal" class="flex-1 p-6 font-mono text-sm overflow-y-auto custom-scroll space-y-2">
                        <p class="text-slate-500 inline-block px-2 py-1 bg-white/5 rounded">Système Pulse OS prêt.</p>
                    </div>
                </div>
            </div>

            <div id="tab-messenger" class="tab-content flex-1 p-8 hidden flex flex-col gap-6">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Serveur cible</label>
                        <select id="guild-select" class="w-full bg-[#0F1219] border border-white/5 rounded-xl px-4 py-4 text-white focus:outline-none no-drag"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Salon textuel</label>
                        <select id="channel-select" class="w-full bg-[#0F1219] border border-white/5 rounded-xl px-4 py-4 text-white focus:outline-none no-drag"></select>
                    </div>
                </div>
                <div class="flex-1 bg-[#0F1219] rounded-3xl border border-white/5 p-6 flex flex-col gap-4">
                    <textarea id="message-content" placeholder="Écrivez votre message ici..." class="flex-1 bg-transparent border-none resize-none text-white focus:outline-none placeholder:text-slate-700 no-drag"></textarea>
                    <div class="flex justify-end pt-4 border-t border-white/5">
                        <button id="send-msg-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-3 rounded-xl transition-all flex items-center gap-2 no-drag">
                            <span>ENVOYER</span>
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="assets/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
